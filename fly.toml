app = "ai-survival-system"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  DATABASE_URL = "sqlite+aiosqlite:////data/ai_survival.db"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[mounts]
  source = "ai_survival_data"
  destination = "/data"